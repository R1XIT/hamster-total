<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
    /*
      No -webkit-app-region: drag here. In Electron an OS window-drag region
      swallows DOM mouse events (mousedown/mouseup/click) and native file `drop`
      events, which broke the drag animation, wake-on-click, and file-eating.
      The window is instead moved manually from JS (see windowDragging.ts +
      the 'move-window' IPC handler in main/index.ts), so the hamster element
      keeps receiving normal DOM events.
    */
    #hamster-root {
      width: 150px; height: 190px;
      cursor: grab;
      display: flex; align-items: flex-end; justify-content: center;
      position: relative;
    }
    #hamster-root:active { cursor: grabbing; }
    #hamster-img { width: 120px; height: 120px; object-fit: contain; -webkit-user-drag: none; }
    .bubble {
      position: absolute; top: 2px; left: 50%; transform: translateX(-50%);
      background: white; border: 1px solid #333; border-radius: 6px; padding: 4px;
      width: 140px; max-height: 64px; overflow-y: auto; box-sizing: border-box;
      font-family: sans-serif; font-size: 10px; line-height: 1.25;
      -webkit-app-region: no-drag;
    }
    .bubble p { margin: 0 0 3px 0; }
    .bubble.hidden { display: none; }
    .bubble button { -webkit-app-region: no-drag; margin: 3px 3px 0 0; font-size: 10px; padding: 1px 4px; }
    #lupa {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 64px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 50%;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
      pointer-events: auto;
      z-index: 10;
    }
    #lupa.hidden { display: none; }
    .vt-bubble.hidden, .vt-engines.hidden { display: none; }
    .vt-count.danger { color: #c0392b; font-weight: bold; }
    .vt-engines { max-height: 160px; overflow-y: auto; padding-left: 18px; margin: 6px 0; }
  </style>
</head>
<body>
  <div id="hamster-root">
    <div id="lupa" class="hidden">🔍</div>
    <img id="hamster-img" src="" alt="hamster" />
  </div>
  <script>require('../../dist/renderer/index.js');</script>
</body>
</html>
