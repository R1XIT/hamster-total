<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
    #hamster-root {
      width: 150px; height: 190px;
      -webkit-app-region: drag;
      display: flex; align-items: flex-end; justify-content: center;
      position: relative;
    }
    #hamster-img { width: 100%; height: 100%; object-fit: contain; -webkit-user-drag: none; }
    .bubble {
      position: absolute; bottom: 480px; left: 50%; transform: translateX(-50%);
      background: white; border: 1px solid #333; border-radius: 8px; padding: 8px;
      max-width: 260px; font-family: sans-serif; font-size: 13px;
      -webkit-app-region: no-drag;
    }
    .bubble.hidden { display: none; }
    .bubble button { -webkit-app-region: no-drag; margin: 4px 4px 0 0; }
  </style>
</head>
<body>
  <div id="hamster-root">
    <img id="hamster-img" src="" alt="hamster" />
  </div>
  <script>require('../../dist/renderer/index.js');</script>
</body>
</html>
